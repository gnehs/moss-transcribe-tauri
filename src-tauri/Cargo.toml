[package]
name = "moss-transcribe-tauri"
default-run = "moss-transcribe-tauri"
version = "0.1.0"
description = "Native MOSS transcription and speaker diarization for Apple Silicon"
authors = ["gnehs"]
edition = "2021"

[lib]
name = "moss_transcribe_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
hf-hub = { version = "1.0.0-rc.1", features = ["blocking", "rustls-tls"] }
hound = "3.5"
memmap2 = "0.9"
rustfft = "6.4"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokenizers = "0.21"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = { path = "vendor/mlx-rs/mlx-rs", features = ["safetensors"], optional = true }
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSWindow", "objc2-core-foundation"] }

[features]
default = ["mlx"]
mlx = ["dep:mlx-rs"]
parity-trace = ["mlx", "dep:sha2"]

[[bin]]
name = "moss-parity-trace"
path = "src/bin/moss_parity_trace.rs"
required-features = ["parity-trace"]

[[test]]
name = "moss_parity"
path = "tests/moss_parity.rs"
required-features = ["parity-trace"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
